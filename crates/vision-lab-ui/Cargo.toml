[package]
name = "vision-lab-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.83"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"

[dependencies.web-sys]
version = "0.3.83"
features = [
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "DataTransfer",
  "Document",
  "DomTokenList",
  "DragEvent",
  "Element",
  "Event",
  "EventTarget",
  "FileList",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "ImageData",
  "Performance",
  "TextMetrics",
  "Window",
  "console",
]
